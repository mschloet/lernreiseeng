
name: AI Code Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Retrieve trusted review scripts
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p scripts

          gh api \
            "repos/$GITHUB_REPOSITORY/contents/scripts/ai_review.py?ref=$BASE_SHA" \
            -H "Accept: application/vnd.github.raw+json" \
            > scripts/ai_review.py

          gh api \
            "repos/$GITHUB_REPOSITORY/contents/scripts/review_prompt.txt?ref=$BASE_SHA" \
            -H "Accept: application/vnd.github.raw+json" \
            > scripts/review_prompt.txt

      - name: Run AI Code Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ai_review.py

